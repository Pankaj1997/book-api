apiVersion: v1
kind: Service
metadata:
  name: {{ include "book-api.fullname" . }}
  labels:
    {{- include "book-api.labels" . | nindent 4 }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For Network Load Balancer
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"  # Public Load Balancer  
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "book-api.selectorLabels" . | nindent 4 }}
